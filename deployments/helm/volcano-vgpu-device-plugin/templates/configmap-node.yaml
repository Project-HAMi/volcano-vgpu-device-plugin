{{- if .Values.nodeConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: volcano-vgpu-node-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: volcano-vgpu-node-plugin
    {{- include "volcano-vgpu.labels" . | nindent 4 }}
data:
  config.json: |
    {
        "nodeconfig": [
          {{- range $index, $config := .Values.nodeConfig.configs }}
          {{- if $index }},{{ end }}
          {{- $filter := default dict $config.filterdevices }}
            {
                "name": {{ if hasKey $config "name" }}{{ $config.name | toJson }}{{ else }}""{{ end }},
                {{- with $config.nodelabelselector }}
                "nodelabelselector": {{ . | toJson }},
                {{- end }}
                "operatingmode": {{ if hasKey $config "operatingmode" }}{{ $config.operatingmode | toJson }}{{ else }}""{{ end }},
                "devicememoryscaling": {{ if hasKey $config "devicememoryscaling" }}{{ $config.devicememoryscaling }}{{ else }}0{{ end }},
                "devicecorescaling": {{ if hasKey $config "devicecorescaling" }}{{ $config.devicecorescaling }}{{ else }}0{{ end }},
                "devicesplitcount": {{ if hasKey $config "devicesplitcount" }}{{ $config.devicesplitcount }}{{ else }}0{{ end }},
                "migstrategy": {{ if hasKey $config "migstrategy" }}{{ $config.migstrategy | toJson }}{{ else }}""{{ end }},
                "filterdevices": {
                  "uuid": {{ default (list) $filter.uuid | toJson }},
                  "index": {{ default (list) $filter.index | toJson }}
                }
            }
          {{- end }}
        ]
    }
{{- end }}
