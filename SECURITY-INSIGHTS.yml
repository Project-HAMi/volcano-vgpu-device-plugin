header:
  schema-version: 2.1.0
  last-updated: '2026-09-22'
  last-reviewed: '2026-09-22'
  url: https://github.com/Project-HAMi/volcano-vgpu-device-plugin/blob/main/SECURITY-INSIGHTS.yml
  comment: |
    Security metadata for volcano-vgpu-device-plugin, following the OpenSSF
    Security Insights specification.

project:
  name: volcano-vgpu-device-plugin
  homepage: https://project-hami.io
  administrators:
    - name: limengxuan
      affiliation: Dynamia AI
      social: https://github.com/archlitchi
      primary: true
  documentation:
    quickstart-guide: https://project-hami.io/docs/installation/how-to-use-volcano-vgpu
    detailed-guide: https://project-hami.io/docs/userguide/volcano-vgpu/nvidia-gpu/how-to-use-volcano-vgpu
    code-of-conduct: https://github.com/Project-HAMi/community/blob/main/CODE-OF-CONDUCT.md
    signature-verification: https://github.com/Project-HAMi/volcano-vgpu-device-plugin/blob/main/SECURITY.md#verifying-release-images
  repositories:
    - name: volcano-vgpu-device-plugin
      url: https://github.com/Project-HAMi/volcano-vgpu-device-plugin
      comment: |
        This repository. Kubernetes device plugin that exposes NVIDIA vGPU
        resources to the Volcano scheduler, subproject of HAMi.
    - name: HAMi-core
      url: https://github.com/Project-HAMi/HAMi-core
      comment: |
        In-container CUDA interception library (libvgpu) that enforces GPU
        memory and compute limits. Included as the libvgpu git submodule and
        compiled into every release image of this repository.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    security-policy: https://github.com/Project-HAMi/volcano-vgpu-device-plugin/blob/main/SECURITY.md
    comment: |
      Report vulnerabilities privately via GitHub Security Advisories:
      https://github.com/Project-HAMi/volcano-vgpu-device-plugin/security/advisories/new
      See SECURITY.md for the full policy and response process.

repository:
  url: https://github.com/Project-HAMi/volcano-vgpu-device-plugin
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  bug-fixes-only: false
  no-third-party-packages: false
  core-team:
    - name: limengxuan
      affiliation: Dynamia AI
      social: https://github.com/archlitchi
      primary: true
  documentation:
    contributing-guide: https://github.com/Project-HAMi/volcano-vgpu-device-plugin/blob/main/CONTRIBUTING.md
    review-policy: https://github.com/Project-HAMi/volcano-vgpu-device-plugin/blob/main/CONTRIBUTING.md#review-requirements
    dependency-management-policy: https://github.com/Project-HAMi/volcano-vgpu-device-plugin/blob/main/SECURITY.md#dependency-management
    security-policy: https://github.com/Project-HAMi/volcano-vgpu-device-plugin/blob/main/SECURITY.md
    governance: https://github.com/Project-HAMi/community/blob/main/community-membership.md
  license:
    url: https://github.com/Project-HAMi/volcano-vgpu-device-plugin/blob/main/LICENSE
    expression: Apache-2.0
  release:
    automated-pipeline: true
    distribution-points:
      - uri: https://hub.docker.com/r/projecthami/volcano-vgpu-device-plugin
        comment: |
          Container image built by the Build Release Image workflow for
          linux/amd64 and linux/arm64 on every vX.Y.Z tag, published as
          projecthami/volcano-vgpu-device-plugin:{version} and signed with
          keyless cosign. See SECURITY.md for the verification command.
      - uri: https://github.com/Project-HAMi/volcano-vgpu-device-plugin
        comment: |
          Source and deployment manifests are distributed only from this
          repository, over HTTPS.
  security:
    assessments:
      self:
        comment: |
          No self assessment has been completed.
    tools:
      - name: Dependabot
        type: SCA
        version: latest
        rulesets:
          - built-in
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          Dependency alerts and weekly update pull requests for Go modules,
          GitHub Actions and the Docker base image.
      - name: CodeQL
        type: SAST
        version: latest
        rulesets:
          - built-in
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: |
          Static analysis of Go code and GitHub Actions workflows on every pull
          request, on pushes to main and weekly.
      - name: GitHub secret scanning
        type: secret
        version: latest
        rulesets:
          - built-in
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          GitHub native secret scanning with push protection, enabled on the
          repository to detect supported secret patterns and block them from
          being pushed.
      - name: OpenSSF Scorecard
        type: other
        version: latest
        rulesets:
          - built-in
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: |
          Weekly and on-push supply chain posture checks, results published to
          the OpenSSF REST API and the code scanning dashboard.
