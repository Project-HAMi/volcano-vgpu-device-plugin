# Run this workflow on new tags
name: Build Release Image

on:
  push:
    tags:
    - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless cosign signing
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - run: go version
    - name: Get tag name
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
    - name: Docker Login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKERHUB_TOKEN }}
        password: ${{ secrets.DOCKERHUB_PASSWD }}
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Generating image tag
      id: runtime-tag
      run: |
        echo tag="$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
    - run: BUILD_PLATFORMS="linux/amd64,linux/arm64" VERSION="${RELEASE_VERSION}" make push-short
    - run: BUILD_PLATFORMS="linux/amd64,linux/arm64" VERSION="${RELEASE_VERSION}-${{ steps.runtime-tag.outputs.tag }}" make push-latest
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - name: Sign images
      # Keyless signing with the workflow's GitHub OIDC identity, by digest so
      # the signature covers exactly the pushed image index.
      env:
        IMAGE: docker.io/projecthami/volcano-vgpu-device-plugin
      run: |
        for tag in "${RELEASE_VERSION}" latest; do
          digest=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "${IMAGE}@${digest}"
        done
